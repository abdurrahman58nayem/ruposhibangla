name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Audit species images
        run: node scripts/check-species-images.cjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret
          NEXT_PUBLIC_SITE_NAME: রূপসী বাংলা
          NEXT_PUBLIC_SITE_URL: https://ruposhibangla.org
