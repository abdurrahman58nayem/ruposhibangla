name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      # দ্রুত ইউনিট টেস্ট (Vitest) — কভারেজের হিসাব, রেট-লিমিট, ক্যাটাগরি/সংখ্যা
      - name: Unit tests
        run: npm run test:unit

      # সিড ও মিডিয়া-চুক্তি (ছবি, ক্রেডিট, ভিডিও, SmartImage)
      - name: Contract checks
        run: npm run test:contract

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret
          NEXT_PUBLIC_SITE_NAME: রূপসী বাংলা
          NEXT_PUBLIC_SITE_URL: https://ruposhibangla.org
